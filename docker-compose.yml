# Local development stack. Not for production (see docker-compose.production.yml).
# Database and GeoServer settings are required from .env. There is no demo
# password fallback. Set unique values before first boot.
services:
  # Laravel Application
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - webgis-network
    depends_on:
      - postgis
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: nginx-webserver
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - webgis-network
    depends_on:
      - laravel-app

  # PostGIS Database
  postgis:
    image: postgis/postgis:13-3.1
    # DG-0.6 target (activate only after DG-0.7 + verification):
    # image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    # volumes:
    #   - postgis-data-pg17:/var/lib/postgresql/data
    container_name: postgis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:?DB_DATABASE is required in .env}"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME is required in .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required in .env (local setup only, no demo fallback)}"
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    networks:
      - webgis-network

  # GeoServer
  geoserver:
    image: kartoza/geoserver:2.21.0
    # DG-0.6 target (activate only after DG-0.7 + verification):
    # image: docker.osgeo.org/geoserver:2.28.6@sha256:d38f2bcae4e64516d49f7d8006384fc46708877a3ec0b386e7fa12fc525bf76c
    # environment extras for OSGeo image (see docs/runbooks/upgrade-pg17-postgis35-geoserver228.md §5.3):
    #   SKIP_DEMO_DATA: "true"
    #   EXTRA_JAVA_OPTS: "-Xms2G -Xmx4G"
    #   INSTALL_EXTENSIONS: "true"
    #   STABLE_EXTENSIONS: "authkey"
    # volumes:
    #   - geoserver-data-228:/opt/geoserver_data/
    #   - ./storage/app/imagery:/opt/imagery
    container_name: geoserver
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: "${GEOSERVER_ADMIN_USER:?GEOSERVER_ADMIN_USER is required in .env}"
      GEOSERVER_ADMIN_PASSWORD: "${GEOSERVER_ADMIN_PASSWORD:?GEOSERVER_ADMIN_PASSWORD is required in .env (local setup only, no demo fallback)}"
      INITIAL_MEMORY: 2G
      MAXIMUM_MEMORY: 4G
      STABLE_EXTENSIONS: ""
      COMMUNITY_EXTENSIONS: ""
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
    ports:
      - "8081:8080"
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
      - ./storage/app/imagery:/opt/imagery
    networks:
      - webgis-network
    depends_on:
      - postgis

  # Redis Cache and Queue
  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - webgis-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work database --sleep=1 --tries=1 --timeout=1800
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - webgis-network
    depends_on:
      - laravel-app
      - postgis
      - redis

  # Laravel scheduler (plugin jobs via PluginManager::registerSchedules — ADR-0001 A4)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - webgis-network
    depends_on:
      - laravel-app
      - postgis
      - redis

networks:
  webgis-network:
    driver: bridge

volumes:
  postgis-data:
    driver: local
  geoserver-data:
    driver: local
  redis-data:
    driver: local
