version: '3.8'

services:
  # Laravel Application
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - webgis-network
    depends_on:
      - postgis
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: nginx-webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - webgis-network
    depends_on:
      - laravel-app

  # PostGIS Database
  postgis:
    image: postgis/postgis:13-3.1
    container_name: postgis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel_gis}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    networks:
      - webgis-network

  # GeoServer
  geoserver:
    image: kartoza/geoserver:2.21.0
    container_name: geoserver
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      INITIAL_MEMORY: 2G
      MAXIMUM_MEMORY: 4G
      STABLE_EXTENSIONS: ""
      COMMUNITY_EXTENSIONS: ""
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
    ports:
      - "8080:8080"
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
    networks:
      - webgis-network
    depends_on:
      - postgis

  # Redis Cache and Queue
  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - webgis-network

networks:
  webgis-network:
    driver: bridge

volumes:
  postgis-data:
    driver: local
  geoserver-data:
    driver: local
  redis-data:
    driver: local
