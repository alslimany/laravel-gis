services:
  # Laravel Application
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: laravel-app-prod
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - app-logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - webgis-network
    depends_on:
      - postgis
      - redis
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Web Server with SSL
  nginx:
    image: nginx:alpine
    container_name: nginx-webserver-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl
      - nginx-logs:/var/log/nginx
    networks:
      - webgis-network
    depends_on:
      - laravel-app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostGIS Database with backup
  postgis:
    image: postgis/postgis:13-3.1
    container_name: postgis-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./docker/postgres/backups:/backups
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - webgis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GeoServer
  geoserver:
    image: kartoza/geoserver:2.21.0
    container_name: geoserver-prod
    restart: always
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      INITIAL_MEMORY: 2G
      MAXIMUM_MEMORY: 4G
      STABLE_EXTENSIONS: ""
      COMMUNITY_EXTENSIONS: ""
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "${APP_URL}"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
      - geoserver-logs:/opt/geoserver/logs
    networks:
      - webgis-network
    depends_on:
      - postgis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/web/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis Cache and Queue
  redis:
    image: redis:alpine
    container_name: redis-cache-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - webgis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Queue Worker
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: queue-worker-prod
    restart: always
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./storage:/var/www/html/storage
      - app-logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - webgis-network
    depends_on:
      - laravel-app
      - redis

  # Database Backup Service
  db-backup:
    image: postgres:13
    container_name: db-backup-prod
    volumes:
      - ./docker/postgres/backups:/backups
      - ./docker/postgres/backup-scripts:/scripts
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: 30
    networks:
      - webgis-network
    depends_on:
      - postgis
    entrypoint: /scripts/backup.sh

networks:
  webgis-network:
    driver: bridge

volumes:
  postgis-data:
    driver: local
  geoserver-data:
    driver: local
  redis-data:
    driver: local
  app-logs:
    driver: local
  nginx-logs:
    driver: local
  geoserver-logs:
    driver: local
